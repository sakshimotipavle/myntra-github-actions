
name: myntra-prod-b21

on:
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t myntra-prod-b21:latest .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify ECR repository
        run: |
          aws sts get-caller-identity
          aws ecr describe-repositories \
            --repository-names myntra \
            --region ap-south-1

      - name: Push Docker image to ECR
        run: |
           aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 990597228500.dkr.ecr.ap-south-1.amazonaws.com

           docker tag myntra-prod-b21:latest 990597228500.dkr.ecr.ap-south-1.amazonaws.com/myntra:latest

           docker push 990597228500.dkr.ecr.ap-south-1.amazonaws.com/myntra:latest